name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false
      play_track:
        description: 'Google Play Release Mode'
        type: choice
        options:
          - internal
          - production
        default: production

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      buildNumber: ${{ steps.meta.outputs.buildNumber }}
    steps:
      - name: Require main for live releases
        if: ${{ github.ref != 'refs/heads/main' && !inputs.dry_run }}
        run: |
          echo "Live releases must run on main. Re-run with dry_run enabled to test this branch."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Sanity checks
        id: meta
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            exit 1
          fi

          ANDROID_VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n 1)
          if [ "$ANDROID_VERSION" != "$VERSION" ]; then
            echo "Android versionName '${ANDROID_VERSION}' does not match package.json version '${VERSION}'"
            exit 1
          fi

          IOS_VERSION=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' ios/App/App.xcodeproj/project.pbxproj | head -n 1)
          if [ "$IOS_VERSION" != "$VERSION" ]; then
            echo "iOS MARKETING_VERSION '${IOS_VERSION}' does not match package.json version '${VERSION}'"
            exit 1
          fi

          ANDROID_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n 1)
          IOS_BUILD=$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([0-9][0-9]*\);/\1/p' ios/App/App.xcodeproj/project.pbxproj | head -n 1)
          if [ -z "$ANDROID_CODE" ] || [ -z "$IOS_BUILD" ]; then
            echo "Could not read Android versionCode ('${ANDROID_CODE}') or iOS CURRENT_PROJECT_VERSION ('${IOS_BUILD}')"
            exit 1
          fi
          if [ "$ANDROID_CODE" != "$IOS_BUILD" ]; then
            echo "Android versionCode '${ANDROID_CODE}' does not match iOS CURRENT_PROJECT_VERSION '${IOS_BUILD}'"
            exit 1
          fi
          echo "buildNumber=$IOS_BUILD" >> "$GITHUB_OUTPUT"
          echo "Build number: $IOS_BUILD"

      - name: Generate release notes
        run: pnpm release-notes

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-artifacts/

  build-web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web
        run: pnpm build

      - name: Zip web build
        run: zip -r "fate-core-web-v${{ needs.prepare.outputs.version }}.zip" dist

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

      - name: Upload web zip
        uses: actions/upload-artifact@v7
        with:
          name: web-zip
          path: fate-core-web-v${{ needs.prepare.outputs.version }}.zip

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Sync Android project
        run: pnpm build:android:ci

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed Android release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Rename Android artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cp android/app/build/outputs/bundle/release/app-release.aab "fate-core-v${VERSION}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "fate-core-v${VERSION}.apk"

      - name: Upload Android bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-bundle
          path: fate-core-v${{ needs.prepare.outputs.version }}.aab

      - name: Upload Android apk
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: fate-core-v${{ needs.prepare.outputs.version }}.apk

  build-ios:
    needs: prepare
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Require iOS 26 SDK
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          MAJOR="${SDK%%.*}"
          if [ "$MAJOR" -lt 26 ]; then
            echo "App Store requires iOS 26 SDK or later (ITMS-90725). Got $SDK."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Sync iOS project
        run: pnpm build:ios:ci

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "AUTH_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive iOS app
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM=M9KUDJFFFS \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Rename IPA
        run: cp "$RUNNER_TEMP/export/"*.ipa "fate-core-v${{ needs.prepare.outputs.version }}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: fate-core-v${{ needs.prepare.outputs.version }}.ipa

  github-release:
    needs: [prepare, build-web, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: artifacts/release-notes/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            artifacts/android-apk/fate-core-v${{ needs.prepare.outputs.version }}.apk
            artifacts/android-bundle/fate-core-v${{ needs.prepare.outputs.version }}.aab
            artifacts/ios-ipa/fate-core-v${{ needs.prepare.outputs.version }}.ipa
            artifacts/web-zip/fate-core-web-v${{ needs.prepare.outputs.version }}.zip

  deploy-pages:
    needs: [build-web, github-release]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  play-upload:
    needs: [prepare, build-android]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download Android bundle
        uses: actions/download-artifact@v7
        with:
          name: android-bundle

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sonder.fate_core
          releaseFiles: fate-core-v${{ needs.prepare.outputs.version }}.aab
          releaseName: v${{ needs.prepare.outputs.version }}
          tracks: ${{ inputs.play_track }}
          status: completed

  appstore-upload:
    needs: [prepare, build-ios]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v7
        with:
          name: ios-ipa

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: fate-core-v${{ needs.prepare.outputs.version }}.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
          wait-for-processing: 'true'

  appstore-submit:
    needs: [prepare, appstore-upload]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - name: Submit to App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.buildNumber }}
        run: node --experimental-transform-types ./scripts/release/submit-appstore.ts
